<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Resultado da Engenharia</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d2026;--muted:#6b7079;--rule:#d9d6cf;--acc:#2e6aa8;--err:#b3261e;--ok:#1c7a4a}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--card:#1d2026;--text:#e8e6e1;--muted:#9a9ea6;--rule:#33363d;--acc:#4a86cc;--err:#e2564b;--ok:#4fbf86}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--text);padding:32px 28px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.brand img{height:34px}
h1{font-size:19px;font-weight:600;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:11px 12px;font:inherit;color:var(--text);background:transparent;border:1px solid var(--rule);border-radius:4px}
input:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
button{margin-top:18px;width:100%;padding:11px;font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}.msg.ok{color:var(--ok)}
.lnk{display:inline-block;margin-top:12px;font-size:13px;color:var(--acc);cursor:pointer;background:none;border:0;padding:0;width:auto;font-weight:400}
.foot{margin-top:14px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
</style></head><body>
<form class="box" id="f" autocomplete="on" hidden>
  <div class="brand"><img alt="Monto" src="logo.png"><div><h1>Resultado da Engenharia</h1><div class="sub" id="sub">Acesso restrito</div></div></div>
  <div id="vLogin">
    <label for="e" style="margin-top:0">E-mail</label><input id="e" type="email" autocomplete="username" placeholder="nome.sobrenome@grupomonto.com.br">
    <label for="p">Senha</label><input id="p" type="password" autocomplete="current-password">
    <button id="b">Entrar</button>
    <button type="button" class="lnk" id="esq">Esqueci a senha</button>
  </div>
  <div id="vNova" hidden>
    <label for="n1" style="margin-top:0">Nova senha</label><input id="n1" type="password" autocomplete="new-password" minlength="8">
    <label for="n2">Repita a nova senha</label><input id="n2" type="password" autocomplete="new-password" minlength="8">
    <button id="bn" type="button">Salvar senha</button>
    <button type="button" class="lnk" id="cancNova">Voltar</button>
  </div>
  <div id="vCarga" hidden>
    <div style="font-size:14px;margin-bottom:6px"><b>Carregar fechamento</b></div>
    <div class="sub" style="margin-bottom:10px">Escolha o arquivo PAINEL_ENGENHARIA_AAAAMM.html gerado pelo motor (pasta SAIDA). Ele vira o mês publicado para todos.</div>
    <input id="arq" type="file" accept=".html,.htm">
    <button id="bc" type="button">Publicar este fechamento</button>
    <button type="button" class="lnk" id="cancCarga">Voltar ao painel</button>
  </div>
  <div class="msg" id="m" role="alert"></div>
  <div class="foot">Conteúdo confidencial da Monto Industrial. Uso interno.</div>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{
const URL_SB='https://xklijhajhuzkhkymojai.supabase.co', KEY='sb_publishable_G3ISbcBK71pdBUlqTsfNMA_xCgICduR';
const sb=window.supabase.createClient(URL_SB,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), msg=(t,ok)=>{$('m').textContent=t||'';$('m').className='msg'+(ok?' ok':'')};
const tela=v=>{$('f').hidden=false;$('vLogin').hidden=v!=='login';$('vNova').hidden=v!=='nova';$('vCarga').hidden=v!=='carga';msg('');if(v!=='carga')(v==='login'?$('e'):$('n1')).focus()};
let carregando=false;
async function abrirPainel(){
  if(carregando)return;carregando=true;
  const {data:{session}}=await sb.auth.getSession();if(!session){carregando=false;return tela('login')}
  $('f').hidden=false;$('vLogin').hidden=true;msg('Carregando o painel…',true);
  const [{data:per},{data:rows,error}]=await Promise.all([sb.rpc('painel_perfil'),sb.from('painel_dados').select('ref,perfil,dados').like('ref','2%').order('ref',{ascending:false}).limit(2)]);
  if(per==='admin'&&(sessionStorage.getItem('pe_carga')||(!error&&rows&&!rows.length))){carregando=false;return tela('carga')}
  if(error||!per||!rows||!rows.length){carregando=false;$('vLogin').hidden=false;
    msg(per?'Nenhum fechamento publicado ainda.':'Seu e-mail não tem acesso a este painel. Fale com o Matheus (Custos).');await sb.auth.signOut();return}
  const ref=rows[0].ref,row=rows.find(r=>r.ref===ref&&r.perfil===per)||rows.find(r=>r.ref===ref);
  const {data:pm}=await sb.from('painel_projecoes').select('oi,wbs,metodo,valor,n,ini,fim,obs,atualizado_por,atualizado_em');
  row.dados.proj_manual=pm||[];
  if(row.perfil==='admin'){ // premissas, tabelas e itens das projeções (uma linha só, ref 0-CONFIG)
    const {data:cf}=await sb.from('painel_dados').select('dados').eq('ref','0-CONFIG').eq('perfil','admin').maybeSingle();
    if(cf&&cf.dados&&cf.dados.cfg){row.dados.cfg_site=cf.dados.cfg;row.dados.cfg_info={em:cf.dados.em,por:cf.dados.por}}
    window.__cfgStore={save:async c=>{const em=new Date().toISOString(),por=session.user.email.split('@')[0];
      const {error}=await sb.from('painel_dados').upsert({ref:'0-CONFIG',perfil:'admin',dados:{cfg:c,em,por}},{onConflict:'ref,perfil'});return {error,em,por}}}}
  window.__painelStore={load:async()=>{const {data}=await sb.from('painel_projecoes').select('*');return data||[]},
    save:async r=>{const {error}=await sb.from('painel_projecoes').upsert(r,{onConflict:'oi,wbs'});return {error}},
    del:async(oi,wbs)=>{const {error}=await sb.from('painel_projecoes').delete().eq('oi',oi).eq('wbs',wbs);return {error}}};
  let h=await (await fetch('painel.html',{cache:'no-cache'})).text();
  h=h.replace('/*__DATA__*/null',JSON.stringify(row.dados).replace(/<\/script/gi,'<\\/script'));
  if(row.perfil!=='admin')h=h.replace('</head>','<style>#tabA,#tabP,#pgAvisos{display:none!important}</style></head>');
  const email=session.user.email;
  document.open();document.write(h);document.close();
  const hd=document.querySelector('header');
  if(hd){hd.style.position='relative';hd.insertAdjacentHTML('beforeend','<div style="position:absolute;top:10px;right:16px;font-size:12px;color:var(--muted)">'+email.replace(/[<>&"]/g,'')+' · <a href="#" id="trocar" style="color:inherit">Trocar senha</a> · <a href="#" id="sair" style="color:inherit">Sair</a></div>')}
  if(row.perfil==='admin'){const sp=document.getElementById('sair');sp.insertAdjacentHTML('beforebegin','<a href="#" id="carga" style="color:inherit">Carregar fechamento</a> · ');
    document.getElementById('carga').onclick=e=>{e.preventDefault();sessionStorage.setItem('pe_carga','1');location.replace(location.pathname)}}
  document.getElementById('sair').onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.replace(location.pathname)};
  document.getElementById('trocar').onclick=e=>{e.preventDefault();sessionStorage.setItem('pe_nova','1');location.replace(location.pathname)};
}
$('f').onsubmit=async e=>{e.preventDefault();const b=$('b');b.disabled=true;b.textContent='Entrando…';msg('');
  const {error}=await sb.auth.signInWithPassword({email:$('e').value.trim().toLowerCase(),password:$('p').value});
  b.disabled=false;b.textContent='Entrar';
  if(error)return msg(/confirm/i.test(error.message)?'E-mail ainda não confirmado. Veja o convite na sua caixa de entrada.':'E-mail ou senha incorretos.');
  abrirPainel()};
$('esq').onclick=async()=>{const em=$('e').value.trim().toLowerCase();if(!em)return msg('Digite seu e-mail e clique de novo em "Esqueci a senha".');
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  msg(error?'Não foi possível enviar agora. Tente de novo em alguns minutos.':'Se o e-mail tiver acesso, chega um link para criar a senha nova.',!error)};
$('bn').onclick=async()=>{const a=$('n1').value,b=$('n2').value;
  if(a.length<8)return msg('A senha precisa ter pelo menos 8 caracteres.');if(a!==b)return msg('As senhas não conferem.');
  $('bn').disabled=true;const {error}=await sb.auth.updateUser({password:a});$('bn').disabled=false;
  if(error)return msg('Não foi possível salvar: '+error.message);
  sessionStorage.removeItem('pe_nova');msg('Senha salva.',true);setTimeout(abrirPainel,600)};
$('bc').onclick=async()=>{const f=$('arq').files[0];if(!f)return msg('Escolha o arquivo do painel.');
  $('bc').disabled=true;msg('Lendo o arquivo…',true);
  try{const h=await f.text();const i=h.indexOf('{"n_idx"');if(i<0)throw new Error('Esse arquivo não é um painel gerado pelo motor.');
    let dep=0,j=i,str=false,esc=false;for(;j<h.length;j++){const c=h[j];if(str){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')str=false;continue}
      if(c==='"')str=true;else if(c==='{')dep++;else if(c==='}'){dep--;if(!dep)break}}
    const d=JSON.parse(h.slice(i,j+1));const ref=d.ref;
    msg('Publicando '+ref+'…',true);
    const adm=Object.assign({},d,{modo:'admin'}),lei=Object.assign({},d,{avisos:[],diverg:[],modo:'leitura'});['hv','grade','hv_meses','cfg0'].forEach(k=>delete lei[k]);
    const {error}=await sb.from('painel_dados').upsert([{ref,perfil:'admin',dados:adm},{ref,perfil:'leitura',dados:lei}],{onConflict:'ref,perfil'});
    if(error)throw new Error(error.message);
    sessionStorage.removeItem('pe_carga');msg('Fechamento '+ref+' publicado.',true);setTimeout(abrirPainel,700)}
  catch(e){msg('Não foi possível publicar: '+e.message)}finally{$('bc').disabled=false}};
$('cancCarga').onclick=()=>{sessionStorage.removeItem('pe_carga');abrirPainel()};
$('cancNova').onclick=()=>{sessionStorage.removeItem('pe_nova');abrirPainel()};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){sessionStorage.setItem('pe_nova','1');tela('nova')}});
(async()=>{const {data:{session}}=await sb.auth.getSession();
  if(session&&(sessionStorage.getItem('pe_nova')||/type=(recovery|invite)/.test(location.hash)))return tela('nova');
  session?abrirPainel():tela('login')})();
})();
</script></body></html>
